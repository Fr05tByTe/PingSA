[alembic]
script_location = app/core/migrations
sqlalchemy.url = postgresql+psycopg://postgres:postgres@postgres:5432/pingsa

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
